name: Build & Package Chromium for Linux

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build & Package for Linux
    runs-on: ubuntu-latest
    env:
      BUILD_ROOT: /mnt/chromium

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git python3 python3-pip build-essential clang ninja-build \
          libnss3 libx11-dev libxcomposite-dev libxcursor-dev \
          libxdamage-dev libxext-dev libxi-dev libxtst-dev \
          libglib2.0-dev libgtk-3-dev libgdk-pixbuf2.0-dev

    - name: Prepare large-disk directory
      run: |
        sudo rm -rf "$BUILD_ROOT"
        sudo mkdir -p "$BUILD_ROOT"
        sudo chown "$(id -u):$(id -g)" "$BUILD_ROOT"

    - name: Clone depot_tools
      run: |
        git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$BUILD_ROOT/depot_tools"
        echo "$BUILD_ROOT/depot_tools" >> $GITHUB_PATH

    - name: Fetch & sync Chromium (shallow + retry)
      run: |
        cd "$BUILD_ROOT"
        fetch --nohooks --no-history chromium
        cd src
        for i in {1..3}; do
          gclient sync && break
          echo "Retrying gclient sync ($i)…"
          sleep 15
        done

    - name: Configure Linux build (GN)
      run: |
        cd "$BUILD_ROOT/src"
        gn gen out/Default --args="is_debug=false is_component_build=false enable_nacl=false"

    - name: Build full Chrome
      run: |
        cd "$BUILD_ROOT/src"
        autoninja -C out/Default chrome

    - name: Package Linux binary
      run: |
        cd "$BUILD_ROOT/src/out/Default"
        tar -czf chrome-linux.tar.gz chrome resources.pak locales version

    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: chrome-linux-tarball
        path: ${{ env.BUILD_ROOT }}/src/out/Default/chrome-linux.tar.gz
