name: Chromium Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git \
          python3 \
          python3-pip \
          build-essential \
          clang \
          cmake \
          ninja-build \
          libnss3 \
          libx11-dev \
          libgdk-pixbuf2.0-dev \
          libglib2.0-dev

    - name: Clean previous chromium directory
      run: |
        rm -rf chromium

    - name: Clone depot_tools
      run: |
        git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
        echo "$PWD/depot_tools" >> $GITHUB_PATH

    - name: Fetch Chromium source
      run: |
        mkdir chromium
        cd chromium
        fetch --nohooks --no-history chromium

    - name: Sync dependencies (retry up to 3 times)
      run: |
        cd chromium
        for i in {1..3}; do
          gclient sync && break
          echo "Retrying gclient sync ($i)..."
          sleep 15
        done

    - name: Configure the build
      run: |
        cd chromium
        gn gen out/Default

    - name: Build Chromium
      run: |
        cd chromium
        autoninja -C out/Default chrome

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: chromium-build
        path: chromium/out/Default/chrome
