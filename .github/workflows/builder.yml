name: Build Mini Chromium Headless Shell on Large Disk

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_ROOT: /mnt/chromium

    steps:
    - name: Checkout this repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git \
          python3 \
          python3-pip \
          build-essential \
          clang \
          ninja-build \
          libnss3 \
          libx11-dev \
          libxcomposite-dev \
          libxcursor-dev \
          libxdamage-dev \
          libxext-dev \
          libxi-dev \
          libxtst-dev \
          libglib2.0-dev \
          libgtk-3-dev

    - name: Prepare large-build directory
      run: |
        sudo rm -rf "$BUILD_ROOT"
        sudo mkdir -p "$BUILD_ROOT"
        sudo chown "$(id -u):$(id -g)" "$BUILD_ROOT"

    - name: Clone depot_tools into large-build
      run: |
        git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$BUILD_ROOT/depot_tools"
        echo "$BUILD_ROOT/depot_tools" >> $GITHUB_PATH

    - name: Fetch Chromium source (shallow)
      run: |
        cd "$BUILD_ROOT"
        fetch --nohooks --no-history chromium

    - name: Sync dependencies (retry up to 3 times)
      run: |
        cd "$BUILD_ROOT/src"
        for i in {1..3}; do
          gclient sync && break
          echo "Retrying gclient sync ($i)…"
          sleep 15
        done

    - name: Configure minimal build with GN
      run: |
        cd "$BUILD_ROOT/src"
        gn gen out/Default \
          --args="is_debug=false is_component_build=false enable_nacl=false"

    - name: Build headless_shell only
      run: |
        cd "$BUILD_ROOT/src"
        autoninja -C out/Default headless_shell

    - name: Upload headless_shell artifact
      uses: actions/upload-artifact@v4
      with:
        name: headless_shell
        path: ${{ env.BUILD_ROOT }}/src/out/Default/headless_shell
