name: Build Mini Chromium

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout this repo
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git \
          cmake \
          ninja-build \
          clang \
          python3 \
          build-essential \
          libx11-dev \
          libxcomposite-dev \
          libxcursor-dev \
          libxdamage-dev \
          libxext-dev \
          libxi-dev \
          libxtst-dev \
          libnss3-dev \
          libglib2.0-dev \
          libgtk-3-dev

    - name: Clone mini_chromium
      run: |
        git clone https://chromium.googlesource.com/chromium/mini_chromium.git
        cd mini_chromium
        git submodule update --init --recursive

    - name: Build mini_chromium
      run: |
        cd mini_chromium
        mkdir out
        cd out
        cmake -G Ninja ..
        ninja

    - name: Upload mini_chromium binary
      uses: actions/upload-artifact@v4
      with:
        name: mini_chromium_build
        path: mini_chromium/out/*
