name: Build Mini Chromium Headless Shell

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git \
          python3 \
          python3-pip \
          build-essential \
          clang \
          cmake \
          ninja-build \
          libnss3 \
          libx11-dev \
          libxcomposite-dev \
          libxcursor-dev \
          libxdamage-dev \
          libxext-dev \
          libxi-dev \
          libxtst-dev \
          libglib2.0-dev \
          libgtk-3-dev

    - name: Clone depot_tools
      run: |
        git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
        echo "$PWD/depot_tools" >> $GITHUB_PATH

    - name: Clean previous chromium directory
      run: rm -rf chromium

    - name: Fetch Chromium source (shallow)
      run: |
        mkdir chromium
        cd chromium
        fetch --nohooks --no-history chromium

    - name: Sync dependencies (retry up to 3 times)
      run: |
        cd chromium
        for i in {1..3}; do
          gclient sync && break
          echo "Retrying gclient sync ($i)…"
          sleep 15
        done

    - name: Configure minimal build with GN
      run: |
        cd chromium
        gn gen out/Default \
          --args="is_debug=false is_component_build=false enable_nacl=false"

    - name: Build headless_shell only
      run: |
        cd chromium
        autoninja -C out/Default headless_shell

    - name: Upload headless_shell artifact
      uses: actions/upload-artifact@v4
      with:
        name: headless_shell
        path: chromium/out/Default/headless_shell
